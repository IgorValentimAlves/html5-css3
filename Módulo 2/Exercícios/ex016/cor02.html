<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Configurações globais das CSS */
            height: 100%;
        }
        body {
            background-image: linear-gradient(45deg,#5650CC,#A22EB5 30%,#E13861,#F86D28,#FECF63);
        }
    </style>
</head>
<body>
    <h1>Testando gradiente</h1>
</body>
</html>
