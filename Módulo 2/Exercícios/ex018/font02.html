<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: '123';
            src: url('fonts/beaming.otf') format(opentype);
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: '123', Times, serif;
            size: 3em;
            font-weight: normal ;
        }

        /*Tipos de format()
        - opentype (otf)
        - truetype (ttf)
        - embedded-opentype
        -truetype-aat(Apple Advance Typography)
        - svg
        */

    </style>
</head>
<body>
    <h1>Fonte personalizada</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Veritatis, architecto. Eius officia voluptas optio! Eos assumenda sequi, blanditiis libero soluta expedita voluptate ipsum voluptatum officiis laborum quae facilis eligendi accusamus.</p>
</body>
</html>
